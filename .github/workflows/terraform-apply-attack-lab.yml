name: Terraform Apply (Attack Lab)

on:
  push:
    branches: [main]
    paths:
      - "environments/attack-lab/**"
      - "modules/**"
      - ".github/workflows/terraform-apply-attack-lab.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-attack-lab-state
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: attack-lab   # <- separate reviewer gate + secrets scope from dev
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_client_ip: ${{ secrets.CLIENT_IP }}
      TF_VAR_target_admin_password: ${{ secrets.ATTACKLAB_TARGET_ADMIN_PASSWORD }}
      TF_VAR_pub_key: ${{ secrets.SSH_PUB_KEY }}
      TF_VAR_law_id: ${{ secrets.DEV_LAW_ID }}
    defaults:
      run:
        working-directory: environments/attack-lab
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve -input=false
